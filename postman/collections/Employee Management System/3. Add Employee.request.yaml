$kind: http-request
url: "{{baseUrl}}/employees"
method: POST
body:
  type: json
  content: |-
    {
      "name": "Ravi Kumar",
      "email": "ravi@test.com",
      "phone": "9876543210",
      "department": "IT",
      "designation": "Developer"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res._id) {
        pm.collectionVariables.set('employeeId', res._id);
      }
    language: text/javascript
order: 3000
